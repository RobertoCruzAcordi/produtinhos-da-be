<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Painel Administrativo - Produtinhos da Bê</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles/admin.css">
</head>

<body>
  <header>
    <h1>Painel Administrativo</h1>
    <div class="acoes-header">
      <a href="index.html">Ver loja</a>
      <button id="btn-sair">Sair</button>
    </div>
  </header>

  <main>
    <section>
      <h2>Produtos cadastrados</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Preço</th>
            <th>Promoção</th>
            <th>Desconto %</th>
            <th>Novo</th>
            <th>Imagem (URL)</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabela-produtos"></tbody>
      </table>
    </section>

    <section>
      <h2>Adicionar / Editar produto</h2>
      <form id="form-produto">
        <input type="hidden" id="produto-id">

        <label>
          Nome:
          <input type="text" id="produto-nome" placeholder="Nome do produto" required>
        </label>

        <label>
          Preço (R$):
          <input type="number" step="0.01" id="produto-preco" placeholder="Preço" required>
        </label>

        <label class="linha-check">
          <input type="checkbox" id="produto-promocao">
          Produto em promoção
        </label>

        <label>
          Desconto (%):
          <input type="number" id="produto-desconto" placeholder="Ex: 10" min="0" max="90">
        </label>

        <label class="linha-check">
          <input type="checkbox" id="produto-novo">
          Marcar como "Novo"
        </label>

        <label>
          URL da imagem (ex: do Imgur):
          <input type="text" id="produto-imagem" placeholder="https://...">
        </label>

        <div class="botoes-form">
          <button type="submit">Salvar</button>
          <button type="button" id="btn-limpar">Limpar</button>
        </div>
      </form>

      <div id="mensagem-admin" class="mensagem"></div>
    </section>
  </main>

      <!-- Firebase (CDN) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

  <!-- Inicialização central do Firebase -->
  <script src="scripts/firebase-init.js"></script>

  <!-- Scripts do admin -->
  <script src="scripts/produtos.js"></script>
  <script src="scripts/admin.js"></script>
</body>
</html>
