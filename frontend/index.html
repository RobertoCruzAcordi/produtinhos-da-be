<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Produtinhos da Bê</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles/index.css">
</head>

<body>
  <header>
    <h1>Produtinhos da Bê</h1>

    <div class="header-right">
      <a href="admin.html">Área administrativa</a>

      <button type="button" id="cart-button" class="cart-button">
        🛒
        <span id="cart-count">0</span>
      </button>
    </div>
  </header>

  <main>
    <section id="lista-produtos"></section>

    <section id="carrinho" class="carrinho-flutuante">
      <h2>Carrinho</h2>
      <div id="itens-carrinho"></div>
      <p><strong>Total: R$ <span id="total">0.00</span></strong></p>
    </section>

    <section id="cliente">
      <h2>Dados do cliente</h2>
      <form id="form-cliente">
        <input type="text" id="nome" placeholder="Nome" required><br>
        <input type="text" id="endereco" placeholder="Endereço" required><br>
        <button type="button" id="btn-whats">Enviar por WhatsApp</button>
      </form>

      <div id="mensagem" class="mensagem"></div>
    </section>
  </main>

   <!-- Firebase (CDN) – os mesmos do admin -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

  <!-- Inicialização central do Firebase -->
  <script src="scripts/firebase-init.js"></script>

  <!-- Scripts da loja -->
  <script src="scripts/produtos.js"></script>
  <script src="scripts/index.js"></script>
</body>
</html>
